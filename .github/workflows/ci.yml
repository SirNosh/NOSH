name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    # Every push to a branch of this repository is tested; pull requests are tested here only when they come from a
    # fork, since a same-repository pull request's commits were already tested as pushes.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm test
      - run: pnpm release:smoke
      - run: pnpm notices
      - run: pnpm sbom
      - uses: actions/upload-artifact@v4
        with:
          name: compliance
          path: |
            release/nosh.cdx.json
            THIRD_PARTY_NOTICES.md

name: Rust port

on:
  push:
    branches: [rust-port]
  pull_request:
    branches: [rust-port]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NOSH_TS_ROOT: ${{ github.workspace }}/ts

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: rust }
      # The TypeScript implementation is the reference: tests compare against its sources, and the
      # differential tests run its built store. Full history lets drift.mjs compare against each
      # crate's sync commit.
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-harness-and-project-intake
          path: ts
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: ts/.nvmrc, cache: pnpm, cache-dependency-path: ts/pnpm-lock.yaml }
      - name: Build the TypeScript reference
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The runtime package's bin/nosh.mjs stub (P8).
      - name: Stub tests
        working-directory: rust
        run: node --test packaging/nosh.test.mjs
      # The PiAdapter tests drive the real sidecar, which needs its own pinned Pi install.
      - name: Install the Pi sidecar
        working-directory: rust/sidecar/pi-host
        run: npm ci
      # Split so a failure names its layer and each step's time shows where the job's minutes go.
      - name: Test (wire, store, sys, research)
        working-directory: rust
        run: cargo test --locked -p nosh-wire -p nosh-store -p nosh-sys -p nosh-research
      - name: Test (agent)
        working-directory: rust
        run: cargo test --locked -p nosh-agent
      - name: Test (orchestration)
        working-directory: rust
        run: cargo test --locked -p nosh-orchestration
      - name: Test (everything else)
        working-directory: rust
        run: cargo test --workspace --locked --exclude nosh-wire --exclude nosh-store --exclude nosh-sys --exclude nosh-research --exclude nosh-agent --exclude nosh-orchestration
      - name: Vendored schemas match TypeScript
        working-directory: rust
        run: node scripts/sync-schemas.mjs --check
      - name: No unported strict TypeScript changes
        working-directory: rust
        run: node scripts/drift.mjs --check

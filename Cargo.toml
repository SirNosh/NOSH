[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/SirNosh/NOSH"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# The shipped binary: whole-program optimization and no symbol table, for size.
[profile.release]
lto = true
codegen-units = 1
strip = true

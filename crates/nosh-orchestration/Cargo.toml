[package]
name = "nosh-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nosh-agent = { version = "0.0.0", path = "../nosh-agent" }
nosh-research = { version = "0.0.0", path = "../nosh-research" }
nosh-store = { version = "0.0.0", path = "../nosh-store" }
nosh-sys = { version = "0.0.0", path = "../nosh-sys" }
nosh-wire = { version = "0.0.0", path = "../nosh-wire" }
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }


[package]
name = "nosh-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
nosh-agent = { version = "0.0.0", path = "../nosh-agent" }
nosh-orchestration = { version = "0.0.0", path = "../nosh-orchestration" }
nosh-research = { version = "0.0.0", path = "../nosh-research" }
nosh-sys = { version = "0.0.0", path = "../nosh-sys" }
nosh-wire = { version = "0.0.0", path = "../nosh-wire" }
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "sync", "time", "macros", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
nosh-store = { version = "0.0.0", path = "../nosh-store" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "test-util"] }

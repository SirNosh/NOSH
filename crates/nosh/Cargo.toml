[package]
name = "nosh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
getrandom = "0.4.3"
nosh-agent = { version = "0.2.0", path = "../nosh-agent" }
nosh-research = { version = "0.2.0", path = "../nosh-research" }
nosh-server = { version = "0.2.0", path = "../nosh-server" }
nosh-store = { version = "0.2.0", path = "../nosh-store" }
nosh-sys = { version = "0.2.0", path = "../nosh-sys" }
nosh-tui = { version = "0.2.0", path = "../nosh-tui" }
nosh-wire = { version = "0.2.0", path = "../nosh-wire" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true

[package]
name = "nosh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nosh-server = { version = "0.0.0", path = "../nosh-server" }
nosh-sys = { version = "0.0.0", path = "../nosh-sys" }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nosh-research = { version = "0.0.0", path = "../nosh-research" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true

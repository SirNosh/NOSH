[package]
name = "nosh-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nosh-sys = { version = "0.2.0", path = "../nosh-sys" }
nosh-wire = { version = "0.2.0", path = "../nosh-wire" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

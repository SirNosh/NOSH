[package]
name = "nosh-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nosh-agent = { version = "0.0.0", path = "../nosh-agent" }
nosh-wire = { version = "0.0.0", path = "../nosh-wire" }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.5", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: correctly rounded number parsing, as `JSON.parse` does (js.rs tests). It is
# already on through nosh-wire's jsonschema; pinned here so JS number parity does not depend on it.
# `unbounded_depth`: JSON.parse has no nesting limit (js.rs). Never add `preserve_order` (INDEX.md
# §2 item 2).
serde_json = { version = "1.0.154", features = ["float_roundtrip", "unbounded_depth"] }
stacker = "0.1.25"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true

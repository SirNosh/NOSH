[package]
name = "nosh-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nosh-wire = { version = "0.2.0", path = "../nosh-wire" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing"] }

# Not `workspace = true`: the workspace forbids unsafe code, and this crate is the one place
# allowed a few documented `unsafe` calls into the operating system.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
